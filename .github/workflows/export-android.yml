name: Export Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  export-android:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config/godot

          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
          ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Export APK
        run: |
          mkdir -p build/android

          godot --headless --verbose \
          --export-debug "Android" \
          build/android/PlatformWonderDemo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/PlatformWonderDemo.apk
