name: Export Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  export-android:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/

          mv /root/.config/godot ~/.config/godot || true

          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Check Android installation
        run: |
          echo "Android SDK:"
          echo $ANDROID_HOME

          echo "Installed build tools:"
          ls -la $ANDROID_HOME/build-tools

          echo "Installed platforms:"
          ls -la $ANDROID_HOME/platforms

          echo "Godot version:"
          godot --version

      - name: Export Android debug APK
        run: |
          mkdir -v -p build/android

          godot --headless --verbose \
            --export-debug "Android" \
            build/android/PlatformWonderDemo.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/PlatformWonderDemo.apk
