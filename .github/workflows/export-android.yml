name: Export Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  export-android:
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Godot export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/

          mv /root/.config/godot ~/.config/godot || true

          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"

      - name: Check Android installation
        run: |
          echo "Android SDK:"
          echo $ANDROID_HOME

          echo ""
          echo "Installed build tools:"
          ls -la $ANDROID_HOME/build-tools

          echo ""
          echo "Installed platforms:"
          ls -la $ANDROID_HOME/platforms

          echo ""
          echo "Godot version:"
          godot --version

          echo ""
          echo "Export presets:"
          cat export_presets.cfg

      - name: Export Android debug APK
        run: |
          mkdir -v -p build/android

          set +e

          godot --headless --verbose \
            --export-debug "Android" \
            build/android/PlatformWonderDemo.apk \
            2>&1 | tee godot-export.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "=========================================="
          echo "IMPORTANT ANDROID EXPORT MESSAGES"
          echo "=========================================="

          grep -i -E \
            "error|configuration|android|sdk|jdk|java|keystore|build tools|apksigner|adb|failed" \
            godot-export.log \
            | tail -100 || true

          echo "=========================================="
          echo "Godot exit code: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/PlatformWonderDemo.apk
